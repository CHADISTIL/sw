<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>jawrab — منصة الناشرين</title>

<!-- PWA META -->
<meta name="application-name" content="jawrab Hub">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="jawrab">
<meta name="theme-color" content="#0a0f0d">
<meta name="description" content="لوحة تحكم متطورة للناشرين">
<link rel="manifest" id="pwaManifest">
<link rel="icon" type="image/png" href="https://i.ibb.co/4T4zKXp/jawrab-icon.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/4T4zKXp/jawrab-icon.png">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://accounts.google.com/gsi/client" async></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0b0e0c;
    font-family: 'Inter', sans-serif;
    color: #eef2ef;
    line-height: 1.5;
  }

  /* Modern Gradient Background */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 30%, rgba(30, 64, 45, 0.25), rgba(0, 0, 0, 0.95));
    pointer-events: none;
    z-index: -1;
  }

  /* Glassmorphism Topbar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 15, 12, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(72, 187, 120, 0.2);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #2b6e3c, #1e4628);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    box-shadow: 0 6px 12px -6px rgba(0,0,0,0.5);
  }

  .brand-name {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(120deg, #c6f7d0, #6fbf4c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand-badge {
    font-size: 0.7rem;
    background: rgba(111, 191, 76, 0.2);
    border-radius: 40px;
    padding: 2px 8px;
    color: #9bdf7a;
  }

  /* Profile Card */
  .profile-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(25, 35, 28, 0.6);
    border-radius: 60px;
    padding: 4px 16px 4px 8px;
    border: 1px solid rgba(111, 191, 76, 0.3);
    backdrop-filter: blur(4px);
  }

  .profile-avatar {
    width: 40px;
    height: 40px;
    background: linear-gradient(145deg, #2b6e3c, #173321);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1rem;
    color: #dcfce7;
    border: 1px solid #6fbf4c;
  }

  .profile-info {
    line-height: 1.3;
  }

  .profile-name {
    font-weight: 700;
    font-size: 0.85rem;
  }

  .profile-role {
    font-size: 0.65rem;
    color: #9ca3af;
  }

  .btn-google {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(111, 191, 76, 0.4);
    border-radius: 40px;
    padding: 8px 18px;
    font-weight: 600;
    font-size: 0.8rem;
    color: #e2e8f0;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-google:hover {
    background: #2b6e3c;
    border-color: #9bdf7a;
  }

  /* Main Container */
  .container {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 20px 60px;
  }

  /* Grid Layouts */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .card {
    background: rgba(18, 24, 20, 0.7);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    border: 1px solid rgba(72, 187, 120, 0.15);
    padding: 1.5rem;
    transition: all 0.2s;
    box-shadow: 0 20px 35px -12px rgba(0,0,0,0.3);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid rgba(111, 191, 76, 0.2);
    padding-bottom: 12px;
  }

  .badge-type {
    background: #1e4628;
    border-radius: 40px;
    padding: 4px 12px;
    font-size: 0.7rem;
    font-weight: 600;
  }

  /* Type pills */
  .type-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .type-pill {
    background: rgba(30, 41, 35, 0.8);
    border: 1px solid rgba(111, 191, 76, 0.3);
    border-radius: 100px;
    padding: 8px 20px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .type-pill i { margin-left: 8px; }
  .type-pill.active {
    background: #2b6e3c;
    border-color: #9bdf7a;
    box-shadow: 0 4px 12px rgba(43,110,60,0.3);
  }

  /* Forms */
  .field {
    margin-bottom: 1.2rem;
  }
  label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #b9c7bc;
    display: block;
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    background: #0f1512;
    border: 1px solid #2a3a30;
    border-radius: 18px;
    padding: 12px 16px;
    color: #f0f7f2;
    font-size: 0.85rem;
    transition: 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #6fbf4c;
    box-shadow: 0 0 0 2px rgba(111,191,76,0.2);
  }
  button {
    cursor: pointer;
  }

  .btn-primary {
    background: linear-gradient(95deg, #2b6e3c, #1e4a2a);
    border: none;
    border-radius: 34px;
    padding: 12px 20px;
    font-weight: 700;
    color: white;
    width: 100%;
    font-size: 0.9rem;
    transition: 0.2s;
  }
  .btn-primary:hover {
    transform: scale(0.98);
    background: linear-gradient(95deg, #358a4a, #256e35);
  }

  /* Quality Row */
  .qual-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .qual-row select { width: 100px; }
  .qual-row input { flex: 1; }

  /* Episode Styling */
  .episode-card {
    background: #0f1512;
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 12px;
  }

  /* Post list with ownership */
  .post-item {
    background: rgba(10, 15, 12, 0.6);
    border-radius: 20px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.1s;
  }
  .post-mine {
    border-right: 3px solid #6fbf4c;
  }
  .post-others {
    opacity: 0.7;
    filter: blur(0.3px);
  }
  .action-group {
    display: flex;
    gap: 6px;
  }
  .btn-icon {
    background: none;
    border: none;
    font-size: 1rem;
    color: #b9c7bc;
    padding: 4px 8px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e2a24;
    backdrop-filter: blur(20px);
    border-radius: 60px;
    padding: 10px 20px;
    z-index: 999;
    font-size: 0.8rem;
    border: 1px solid #6fbf4c;
  }

  @media (max-width: 780px) {
    .grid-2 { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon"><i class="fas fa-feather-alt"></i></div>
    <div>
      <div class="brand-name">jawrab<span class="brand-badge"> ناشر</span></div>
      <div style="font-size: 0.7rem; color: #8aa399;">لوحة متطورة للنشر المرئي</div>
    </div>
  </div>
  <div id="authArea">
    <div class="profile-card" id="profileCard" style="display: none;">
      <div class="profile-avatar" id="avatarInitial">J</div>
      <div class="profile-info">
        <div class="profile-name" id="userName">الناشر</div>
        <div class="profile-role" id="userEmail">publisher@jawrab.com</div>
      </div>
    </div>
    <button class="btn-google" id="loginBtn" onclick="initGoogleLogin()"><i class="fab fa-google"></i> تسجيل الدخول</button>
  </div>
</div>

<div class="container">
  <!-- Type selector -->
  <div class="type-pills" id="typeSelector">
    <div class="type-pill active" data-type="movie"><i class="fas fa-film"></i> فيلم</div>
    <div class="type-pill" data-type="series"><i class="fas fa-tv"></i> مسلسل</div>
    <div class="type-pill" data-type="anime"><i class="fas fa-dragon"></i> أنمي</div>
    <div class="type-pill" data-type="youtube"><i class="fab fa-youtube"></i> يوتيوب</div>
    <div class="type-pill" data-type="live"><i class="fas fa-broadcast-tower"></i> بث مباشر</div>
  </div>

  <div class="grid-2">
    <!-- LEFT: Form -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-edit" style="color:#6fbf4c;"></i>
        <h3 id="formTitle">نشر فيلم جديد</h3>
      </div>
      <div class="field">
        <label>العنوان الرئيسي *</label>
        <input type="text" id="titleInput" placeholder="اسم المحتوى">
      </div>
      <div class="field" id="descField">
        <label>الوصف / القصة</label>
        <textarea id="descInput" rows="3" placeholder="وصف مختصر..."></textarea>
      </div>
      <div class="field">
        <label>رابط الصورة المصغرة</label>
        <input type="url" id="thumbInput" placeholder="https://...">
      </div>

      <!-- Video qualities (for movie/video) -->
      <div id="qualitiesSection" style="display: block;">
        <label>جودات الفيديو (رابط MP4 أو M3U8)</label>
        <div id="qualitiesContainer"></div>
        <button onclick="addQualityField()" style="background: #1a2a22; border: 1px dashed #6fbf4c; border-radius: 30px; padding: 6px; width:100%; margin-top:8px;">+ إضافة جودة</button>
      </div>

      <!-- Episodes section (series/anime) -->
      <div id="episodesSection" style="display: none;">
        <label>قائمة الحلقات</label>
        <div id="episodesContainer"></div>
        <button onclick="addEpisodeField()" style="background: #1a2a22; border: 1px dashed #6fbf4c; border-radius: 30px; padding: 6px; width:100%; margin-top:8px;">+ إضافة حلقة</button>
      </div>

      <!-- Live section -->
      <div id="liveSection" style="display: none;">
        <div class="field"><label>رابط البث (M3U8)</label><input type="url" id="liveUrlInput" placeholder="https://..."></div>
        <div class="field"><label>اسم القناة</label><input type="text" id="liveTitleInput"></div>
      </div>

      <!-- YouTube section -->
      <div id="youtubeSection" style="display: none;">
        <div class="field"><label>رابط يوتيوب</label><input type="url" id="ytUrlInput" placeholder="https://youtu.be/..."></div>
      </div>

      <div class="field"><label>وسوم (Blogger Labels) مفصولة بفاصلة</label><input type="text" id="labelsInput" placeholder="فيلم, 2025, أكشن"></div>
      <div class="field"><label>حالة النشر</label>
        <select id="statusSelect"><option value="LIVE">نشر مباشر</option><option value="DRAFT">مسودة</option></select>
      </div>
      <button class="btn-primary" id="publishBtn" onclick="publishPost()"><i class="fas fa-paper-plane"></i> نشر / تحديث</button>
      <div id="progressMsg" style="margin-top: 12px; font-size: 0.7rem; color: #9bdf7a; text-align: center;"></div>
    </div>

    <!-- RIGHT: Posts List (only publisher's own posts) -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-user-check"></i>
        <h3>مقالاتي المنشورة</h3>
        <span style="margin-right: auto; font-size: 0.7rem;" id="postCount"></span>
      </div>
      <div id="postsListContainer" style="max-height: 550px; overflow-y: auto;">
        <div style="text-align:center; padding: 40px;">🔐 سجّل الدخول لرؤية محتواك</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- CONFIG ----------
  const CLIENT_ID = "1095244236392-eqhgorr4t587vvr4vblmvlkqbh8kae9i.apps.googleusercontent.com";
  const BLOG_ID = "6155177137677743195";
  let accessToken = null;
  let currentUser = { name: "", email: "", picture: "" };
  let editMode = false, editPostId = null;
  let currentType = "movie";

  // Dynamic arrays
  let qualities = [];   // each { label, url }
  let episodes = [];    // each { title, url }

  // DOM Elements
  const typePills = document.querySelectorAll('.type-pill');
  const descField = document.getElementById('descField');
  const qualitiesSection = document.getElementById('qualitiesSection');
  const episodesSection = document.getElementById('episodesSection');
  const liveSection = document.getElementById('liveSection');
  const youtubeSection = document.getElementById('youtubeSection');
  const formTitle = document.getElementById('formTitle');

  function updateUIByType() {
    const isSeriesOrAnime = (currentType === 'series' || currentType === 'anime');
    const isMovie = currentType === 'movie';
    const isVideo = currentType === 'video' || isMovie;
    const isLive = currentType === 'live';
    const isYoutube = currentType === 'youtube';

    descField.style.display = (isSeriesOrAnime || isMovie) ? 'block' : 'none';
    qualitiesSection.style.display = (isVideo || currentType === 'series' || currentType === 'anime') ? 'block' : 'none';
    episodesSection.style.display = isSeriesOrAnime ? 'block' : 'none';
    liveSection.style.display = isLive ? 'block' : 'none';
    youtubeSection.style.display = isYoutube ? 'block' : 'none';
    if (currentType === 'movie') formTitle.innerText = '📽️ نشر فيلم';
    else if (currentType === 'series') formTitle.innerText = '📺 نشر مسلسل';
    else if (currentType === 'anime') formTitle.innerText = '🐉 نشر أنمي';
    else if (currentType === 'youtube') formTitle.innerText = '▶️ نشر يوتيوب';
    else if (currentType === 'live') formTitle.innerText = '📡 بث مباشر';
    else formTitle.innerText = 'نشر محتوى';
  }

  typePills.forEach(pill => {
    pill.addEventListener('click', () => {
      typePills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      currentType = pill.getAttribute('data-type');
      updateUIByType();
      resetFormFields();
    });
  });

  function addQualityField(labelVal = "1080p", urlVal = "") {
    const idx = qualities.length;
    qualities.push({ label: labelVal, url: urlVal });
    const container = document.getElementById('qualitiesContainer');
    const div = document.createElement('div');
    div.className = 'qual-row';
    div.id = `qual_${idx}`;
    div.innerHTML = `
      <select onchange="qualities[${idx}].label=this.value">
        <option ${labelVal==='4K'?'selected':''}>4K</option><option ${labelVal==='1080p'?'selected':''}>1080p</option>
        <option ${labelVal==='720p'?'selected':''}>720p</option><option ${labelVal==='480p'?'selected':''}>480p</option>
      </select>
      <input type="text" placeholder="رابط الفيديو" value="${urlVal.replace(/"/g, '&quot;')}" oninput="qualities[${idx}].url=this.value">
      <button onclick="removeQuality(${idx})" style="background:#3a2a2a; border-radius:30px; padding:4px 10px;">🗑️</button>
    `;
    container.appendChild(div);
  }

  function removeQuality(idx) {
    qualities[idx] = null;
    const el = document.getElementById(`qual_${idx}`);
    if (el) el.remove();
    qualities = qualities.filter(q => q !== null);
    // reindex to avoid UI conflict but fine
  }

  function addEpisodeField(epTitle = "", epUrl = "") {
    const idx = episodes.length;
    episodes.push({ title: epTitle, url: epUrl });
    const container = document.getElementById('episodesContainer');
    const div = document.createElement('div');
    div.className = 'episode-card';
    div.id = `ep_${idx}`;
    div.innerHTML = `
      <input type="text" placeholder="عنوان الحلقة" value="${epTitle.replace(/"/g, '&quot;')}" oninput="episodes[${idx}].title=this.value" style="margin-bottom:6px;">
      <input type="url" placeholder="رابط الفيديو" value="${epUrl.replace(/"/g, '&quot;')}" oninput="episodes[${idx}].url=this.value">
      <button onclick="removeEpisode(${idx})" style="margin-top:6px; background:#3a2a2a; border-radius:20px; padding:4px;">حذف الحلقة</button>
    `;
    container.appendChild(div);
  }

  function removeEpisode(idx) {
    episodes[idx] = null;
    const el = document.getElementById(`ep_${idx}`);
    if (el) el.remove();
    episodes = episodes.filter(e => e !== null);
  }

  function resetFormFields() {
    document.getElementById('titleInput').value = '';
    document.getElementById('descInput').value = '';
    document.getElementById('thumbInput').value = '';
    document.getElementById('labelsInput').value = '';
    document.getElementById('liveUrlInput').value = '';
    document.getElementById('liveTitleInput').value = '';
    document.getElementById('ytUrlInput').value = '';
    qualities = [];
    episodes = [];
    document.getElementById('qualitiesContainer').innerHTML = '';
    document.getElementById('episodesContainer').innerHTML = '';
    addQualityField('1080p', '');
    editMode = false; editPostId = null;
    document.getElementById('publishBtn').innerHTML = '<i class="fas fa-paper-plane"></i> نشر / تحديث';
  }

  function buildContentJSON() {
    const title = document.getElementById('titleInput').value;
    const desc = document.getElementById('descInput').value;
    const thumb = document.getElementById('thumbInput').value;
    const labelsRaw = document.getElementById('labelsInput').value;
    const liveUrl = document.getElementById('liveUrlInput').value;
    const liveTitle = document.getElementById('liveTitleInput').value;
    const ytUrl = document.getElementById('ytUrlInput').value;

    let qualitiesClean = qualities.filter(q => q && q.url.trim() !== "");
    let episodesClean = episodes.filter(ep => ep && ep.url.trim() !== "");

    const data = {
      type: currentType,
      title, desc, thumb,
      labels: labelsRaw.split(',').map(l=>l.trim()).filter(l=>l),
      qualities: qualitiesClean,
      episodes: episodesClean,
      live: { url: liveUrl, title: liveTitle },
      youtube: ytUrl,
      authorEmail: currentUser.email
    };
    return JSON.stringify(data);
  }

  async function publishPost() {
    if (!accessToken) { showToast("يرجى تسجيل الدخول أولاً", "error"); return; }
    const titleVal = document.getElementById('titleInput').value.trim();
    if (!titleVal) { showToast("العنوان مطلوب", "error"); return; }
    const contentMeta = buildContentJSON();
    const finalHTML = `<!-- JAWRAB_V3:${contentMeta} -->\n<div style="padding:20px;"><h1>${escapeHtml(titleVal)}</h1><p>محتوى وسائط متكامل عبر jawrab</p></div>`;
    const labelsArr = document.getElementById('labelsInput').value.split(',').map(l=>l.trim()).filter(l=>l);
    const isDraft = (document.getElementById('statusSelect').value === 'DRAFT');
    let url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts`;
    let method = 'POST';
    if (editMode && editPostId) {
      url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${editPostId}?publish=${!isDraft}`;
      method = 'PUT';
    } else {
      url += `?isDraft=${isDraft}`;
    }
    const postBody = {
      kind: "blogger#post",
      title: titleVal,
      content: finalHTML,
      labels: labelsArr
    };
    try {
      document.getElementById('progressMsg').innerText = "⏳ جاري النشر...";
      const res = await fetch(url, {
        method, headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(postBody)
      });
      if (res.ok) {
        showToast(editMode ? "تم التحديث!" : "تم النشر بنجاح!", "success");
        resetFormFields();
        loadMyPosts();
      } else {
        const err = await res.json();
        showToast("خطأ: " + (err.error?.message || "غير معروف"), "error");
      }
    } catch(e) { showToast("فشل الاتصال", "error"); }
    document.getElementById('progressMsg').innerText = "";
  }

  async function loadMyPosts() {
    if (!accessToken) return;
    try {
      const res = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts?maxResults=30`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const data = await res.json();
      const container = document.getElementById('postsListContainer');
      if (!data.items) { container.innerHTML = "<div style='text-align:center'>لا توجد مقالات</div>"; return; }
      let myPosts = [];
      for (let post of data.items) {
        let ownerMatch = false;
        if (post.content) {
          const match = post.content.match(/<!--\s*JAWRAB_V3:({.*?})\s*-->/s);
          if (match) {
            try {
              let meta = JSON.parse(match[1]);
              if (meta.authorEmail === currentUser.email) ownerMatch = true;
            } catch(e) {}
          }
        }
        if (!ownerMatch && post.labels && post.labels.includes(currentUser.email)) ownerMatch = true;
        if (ownerMatch) myPosts.push(post);
      }
      if (myPosts.length === 0) { container.innerHTML = "<div style='padding:20px; text-align:center;'>✨ لا توجد مقالات خاصة بك بعد</div>"; return; }
      container.innerHTML = myPosts.map(post => `
        <div class="post-item post-mine">
          <div><strong>${escapeHtml(post.title)}</strong><br><span style="font-size:0.7rem;">${new Date(post.published).toLocaleDateString()}</span></div>
          <div class="action-group">
            <button class="btn-icon" onclick="editPostById('${post.id}')"><i class="fas fa-pen"></i></button>
            <button class="btn-icon" onclick="deletePostById('${post.id}')"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
      document.getElementById('postCount').innerText = myPosts.length + " مقال";
    } catch(e) { console.log(e); }
  }

  async function editPostById(postId) {
    if (!accessToken) return;
    const res = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${postId}`, {
      headers: { 'Authorization': `Bearer ${accessToken}` }
    });
    const post = await res.json();
    const match = post.content.match(/<!--\s*JAWRAB_V3:({.*?})\s*-->/s);
    if (match) {
      let meta = JSON.parse(match[1]);
      document.getElementById('titleInput').value = post.title || "";
      document.getElementById('descInput').value = meta.desc || "";
      document.getElementById('thumbInput').value = meta.thumb || "";
      document.getElementById('labelsInput').value = (meta.labels || []).join(", ");
      if (meta.qualities) { qualities = meta.qualities; rebuildQualitiesUI(); }
      if (meta.episodes) { episodes = meta.episodes; rebuildEpisodesUI(); }
      if (meta.live) { document.getElementById('liveUrlInput').value = meta.live.url || ""; document.getElementById('liveTitleInput').value = meta.live.title || ""; }
      if (meta.youtube) document.getElementById('ytUrlInput').value = meta.youtube;
      currentType = meta.type || "movie";
      // reflect active pill
      typePills.forEach(p => { if(p.getAttribute('data-type')===currentType) p.click(); });
      editMode = true; editPostId = postId;
      document.getElementById('publishBtn').innerHTML = '<i class="fas fa-save"></i> تحديث المقال';
    } else { showToast("لا يمكن تحرير هذا الإصدار القديم", "error"); }
  }

  function rebuildQualitiesUI() {
    document.getElementById('qualitiesContainer').innerHTML = '';
    qualities.forEach((q, idx) => addQualityField(q.label, q.url));
  }
  function rebuildEpisodesUI() {
    document.getElementById('episodesContainer').innerHTML = '';
    episodes.forEach((ep, idx) => addEpisodeField(ep.title, ep.url));
  }

  async function deletePostById(postId) {
    if (!confirm("حذف دائم؟")) return;
    await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${postId}`, {
      method: 'DELETE', headers: { 'Authorization': `Bearer ${accessToken}` }
    });
    showToast("تم الحذف", "success");
    loadMyPosts();
  }

  function initGoogleLogin() {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: "https://www.googleapis.com/auth/blogger https://www.googleapis.com/auth/userinfo.email",
      callback: async (response) => {
        if (response.access_token) {
          accessToken = response.access_token;
          const userRes = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { Authorization: `Bearer ${accessToken}` } });
          const userInfo = await userRes.json();
          currentUser.name = userInfo.name;
          currentUser.email = userInfo.email;
          document.getElementById('profileCard').style.display = 'flex';
          document.getElementById('avatarInitial').innerText = currentUser.name.charAt(0).toUpperCase();
          document.getElementById('userName').innerText = currentUser.name;
          document.getElementById('userEmail').innerText = currentUser.email;
          document.getElementById('loginBtn').style.display = 'none';
          loadMyPosts();
          showToast(`مرحباً ${currentUser.name}`, "success");
          resetFormFields();
        }
      }
    });
    client.requestAccessToken();
  }

  function showToast(msg, type) {
    let t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  window.addEventListener('DOMContentLoaded', () => {
    updateUIByType();
    addQualityField('1080p', '');
  });
</script>
