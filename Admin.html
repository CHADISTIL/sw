<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Blogger Pro Single PWA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://accounts.google.com/gsi/client"></script>

<style>
body{
    font-family: Arial;
    background:#0f0f0f;
    color:#fff;
    margin:0;
    padding:20px;
}

.container{ max-width:900px; margin:auto; }

input, textarea, select{
    width:100%;
    margin:8px 0;
    padding:10px;
    border-radius:8px;
    border:none;
    background:#222;
    color:#fff;
}

textarea{ min-height:200px; }

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:5px 0;
}

.btn{ background:#4CAF50; color:#fff; }
.btn2{ background:#2196F3; color:#fff; }

.postItem{
    background:#1c1c1c;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>📌 Blogger Pro PWA (Single File)</h2>

<button class="btn2" onclick="login()">تسجيل الدخول</button>

<hr>

<input id="title" placeholder="عنوان المقال">
<input id="labels" placeholder="تصنيفات">
<input type="file" id="imageInput">

<textarea id="content" placeholder="المحتوى"></textarea>

<select id="status">
<option value="DRAFT">مسودة</option>
<option value="LIVE">نشر مباشر</option>
</select>

<button class="btn" onclick="publish()">نشر / تعديل</button>
<button class="btn2" onclick="loadPosts()">عرض المقالات</button>

<p id="statusText"></p>

<div id="posts"></div>

</div>

<script>
const CLIENT_ID = "1095244236392-eqhgorr4t587vvr4vblmvlkqbh8kae9i.apps.googleusercontent.com";
const BLOG_ID = "6155177137677743195";

let token = "";
let editMode = false;
let editPostId = null;

/* ===== Google Login ===== */
function login(){
    const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/blogger",
        callback: (res) => {
            token = res.access_token;
            document.getElementById("statusText").innerText = "تم تسجيل الدخول ✅";
        }
    });
    client.requestAccessToken();
}

/* ===== Image ===== */
function imageToBase64(file){
    return new Promise((resolve)=>{
        let r = new FileReader();
        r.onload = ()=> resolve(r.result);
        r.readAsDataURL(file);
    });
}

/* ===== Publish / Update ===== */
async function publish(){

    if(!token){
        alert("سجل الدخول أولاً");
        return;
    }

    let title = document.getElementById("title").value;
    let content = document.getElementById("content").value;
    let labels = document.getElementById("labels").value.split(",");
    let status = document.getElementById("status").value;

    let img = document.getElementById("imageInput").files[0];
    if(img){
        let base64 = await imageToBase64(img);
        content = `<img src="${base64}" style="max-width:100%"><br>` + content;
    }

    let post = {
        kind:"blogger#post",
        title,
        content,
        labels
    };

    let url = "";
    let method = "";

    if(editMode){
        url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${editPostId}`;
        method = "PUT";
    } else {
        url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/insert`;
        method = "POST";
    }

    url += `?isDraft=${status !== "LIVE"}`;

    let res = await fetch(url,{
        method,
        headers:{
            "Authorization":"Bearer "+token,
            "Content-Type":"application/json"
        },
        body:JSON.stringify(post)
    });

    if(res.ok){
        document.getElementById("statusText").innerText =
        editMode ? "تم التعديل ✏️" : "تم النشر ✅";

        editMode = false;
        editPostId = null;

        loadPosts();
    } else {
        document.getElementById("statusText").innerText = "خطأ ❌";
    }
}

/* ===== Load Posts ===== */
async function loadPosts(){

    let res = await fetch(
        `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts`,
        { headers:{"Authorization":"Bearer "+token} }
    );

    let data = await res.json();

    let html = "";

    data.items?.forEach(p=>{
        html += `
        <div class="postItem">
            <b>${p.title}</b><br>

            <button onclick="editPost('${p.id}','${encodeURIComponent(p.title)}','${encodeURIComponent(p.content)}')">
                تعديل
            </button>

            <button onclick="deletePost('${p.id}')">
                حذف
            </button>
        </div>`;
    });

    document.getElementById("posts").innerHTML = html;
}

/* ===== Edit ===== */
function editPost(id,title,content){
    editMode = true;
    editPostId = id;

    document.getElementById("title").value = decodeURIComponent(title);
    document.getElementById("content").value = decodeURIComponent(content);

    document.getElementById("statusText").innerText = "وضع التعديل ✏️";
}

/* ===== Delete ===== */
async function deletePost(id){

    if(!confirm("حذف المقال؟")) return;

    await fetch(
        `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${id}`,
        {
            method:"DELETE",
            headers:{
                "Authorization":"Bearer "+token
            }
        }
    );

    loadPosts();
}

/* ===== PWA (Inline Manifest + SW) ===== */
const manifest = {
    name:"Blogger Pro",
    short_name:"Blogger",
    start_url:".",
    display:"standalone",
    background_color:"#0f0f0f",
    theme_color:"#4CAF50",
    icons:[{src:"icon.png",sizes:"192x192",type:"image/png"}]
};

const blob = new Blob([JSON.stringify(manifest)],{type:"application/json"});
const url = URL.createObjectURL(blob);

let link = document.createElement("link");
link.rel = "manifest";
link.href = url;
document.head.appendChild(link);

/* Service Worker داخل نفس الملف */
if('serviceWorker' in navigator){

const swCode = `
self.addEventListener('install',e=>{
self.skipWaiting();
});

self.addEventListener('fetch',e=>{
e.respondWith(fetch(e.request).catch(()=>new Response("Offline")));
});
`;

const swBlob = new Blob([swCode],{type:"text/javascript"});
const swURL = URL.createObjectURL(swBlob);

navigator.serviceWorker.register(swURL);
}
</script>

</body>
</html>
