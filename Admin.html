<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Blogger Pro Single PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 900px; margin: auto; }
        input, textarea, select {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }
        textarea { min-height: 200px; }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px 0;
            font-weight: bold;
        }
        .btn { background: #4CAF50; color: #fff; }
        .btn2 { background: #2196F3; color: #fff; }
        .postItem {
            background: #1c1c1c;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .postItem button { margin-right: 5px; background: #444; color: #fff; }
        #statusText { font-weight: bold; color: #ffca28; margin: 10px 0; }
    </style>
</head>

<body>

<div class="container">
    <h2>📌 Blogger Pro PWA (Single File)</h2>
    <button class="btn2" onclick="login()">تسجيل الدخول</button>
    <span id="statusText">لم يتم تسجيل الدخول ❌</span>
    <hr style="border-color: #333;">

    <input id="title" placeholder="عنوان المقال">
    <input id="labels" placeholder="تصنيفات (افصل بينها بفاصلة ,)">
    <input type="file" id="imageInput" accept="image/*">
    <textarea id="content" placeholder="المحتوى"></textarea>

    <select id="postStatus">
        <option value="DRAFT">مسودة</option>
        <option value="LIVE">نشر مباشر</option>
    </select>

    <button class="btn" onclick="publish()">نشر / تعديل</button>
    <button class="btn2" onclick="loadPosts()">عرض المقالات</button>
    <div id="posts"></div>
</div>

<script>
const CLIENT_ID = "1095244236392-eqhgorr4t587vvr4vblmvlkqbh8kae9i.apps.googleusercontent.com";
const BLOG_ID = "6155177137677743195";

let token = "";
let editMode = false;
let editPostId = null;

/* ===== Google Login ===== */
function login(){
    const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/blogger",
        callback: (res) => {
            if (res.access_token) {
                token = res.access_token;
                document.getElementById("statusText").innerText = "تم تسجيل الدخول ✅";
            } else {
                document.getElementById("statusText").innerText = "فشل الحصول على رمز الدخول ❌";
            }
        }
    });
    client.requestAccessToken();
}

/* ===== Image to Base64 ===== */
function imageToBase64(file){
    return new Promise((resolve)=>{
        let r = new FileReader();
        r.onload = ()=> resolve(r.result);
        r.readAsDataURL(file);
    });
}

/* ===== Publish / Update ===== */
async function publish(){
    if(!token){
        alert("سجل الدخول أولاً");
        return;
    }

    let titleValue = document.getElementById("title").value.trim();
    let contentValue = document.getElementById("content").value.trim();
    let statusValue = document.getElementById("postStatus").value;
    
    let labelsInput = document.getElementById("labels").value;
    let labelsArray = labelsInput ? labelsInput.split(",").map(l => l.trim()).filter(l => l !== "") : [];

    document.getElementById("statusText").innerText = "جاري المعالجة... ⏳";

    // معالجة الصورة
    let img = document.getElementById("imageInput").files[0];
    if(img){
        let base64 = await imageToBase64(img);
        contentValue = `<img src="${base64}" style="max-width:100%"><br><br>` + contentValue;
    }

    // بناء كائن المقال بشكل يتوافق بدقة مع شروط Google
    let postData = {
        kind: "blogger#post",
        title: titleValue || "مقال جديد بدون عنوان",
        content: contentValue || "محتوى المقال فارغ"
    };

    if(labelsArray.length > 0) {
        postData.labels = labelsArray;
    }

    let url = "";
    let method = "";

    if(editMode && editPostId){
        url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${editPostId}`;
        method = "PUT";
    } else {
        url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/insert`;
        method = "POST";
    }

    // إصلاح الخطأ: استخدام المتغير الصحيح statusValue بدلاً من status العام
    url += `?isDraft=${statusValue !== "LIVE"}`;

    try {
        let res = await fetch(url,{
            method,
            headers:{
                "Authorization":"Bearer " + token,
                "Content-Type":"application/json"
            },
            body: JSON.stringify(postData)
        });

        if(res.ok){
            document.getElementById("statusText").innerText = editMode ? "تم التعديل بنجاح ✏️" : "تم النشر بنجاح ✅";

            // تفريغ الحقول
            document.getElementById("title").value = "";
            document.getElementById("content").value = "";
            document.getElementById("labels").value = "";
            document.getElementById("imageInput").value = "";

            editMode = false;
            editPostId = null;

            loadPosts(); 
        } else {
            let errorData = await res.json();
            console.error("Blogger API Error:", errorData);
            document.getElementById("statusText").innerText = `خطأ من جوجل: ${errorData.error.message} ❌`;
        }
    } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById("statusText").innerText = "فشل الاتصال بالخادم ❌";
    }
}

/* ===== Load Posts ===== */
async function loadPosts(){
    if(!token){
        alert("سجل الدخول أولاً");
        return;
    }
    document.getElementById("posts").innerHTML = "<p>جاري التحميل... ⏳</p>";
    try {
        let res = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts`, {
            headers:{"Authorization":"Bearer " + token}
        });
        let data = await res.json();
        let html = "";
        if(data.items && data.items.length > 0) {
            data.items.forEach(p=>{
                html += `
                <div class="postItem">
                    <b>${p.title}</b><br><br>
                    <button onclick="editPost('${p.id}','${encodeURIComponent(p.title)}','${encodeURIComponent(p.content)}')">تعديل</button>
                    <button style="background:#f44336;" onclick="deletePost('${p.id}')">حذف</button>
                </div>`;
            });
        } else {
            html = "<p>لا توجد مقالات.</p>";
        }
        document.getElementById("posts").innerHTML = html;
    } catch(err) {
        document.getElementById("posts").innerHTML = "<p>حدث خطأ أثناء جلب المقالات ❌</p>";
    }
}

/* ===== Edit Mode ===== */
function editPost(id, title, content){
    editMode = true;
    editPostId = id;
    document.getElementById("title").value = decodeURIComponent(title);
    document.getElementById("content").value = decodeURIComponent(content);
    document.getElementById("statusText").innerText = "وضع التعديل نشط ✏️";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== Delete Post ===== */
async function deletePost(id){
    if(!confirm("حذف المقال؟")) return;
    try {
        let res = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${id}`, {
            method:"DELETE",
            headers:{ "Authorization":"Bearer " + token }
        });
        if(res.ok) { loadPosts(); }
    } catch (err) { console.error(err); }
}

/* ===== PWA Setup ===== */
const manifest = {
    name:"Blogger Pro", short_name:"Blogger", start_url:".", display:"standalone",
    background_color:"#0f0f0f", theme_color:"#4CAF50", icons:[{src:"icon.png",sizes:"192x192",type:"image/png"}]
};
const blob = new Blob([JSON.stringify(manifest)],{type:"application/json"});
const url = URL.createObjectURL(blob);
let link = document.createElement("link"); link.rel = "manifest"; link.href = url; document.head.appendChild(link);

if('serviceWorker' in navigator){
    const swCode = `
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('fetch',e=>{ e.respondWith(fetch(e.request).catch(()=>new Response("Offline"))); });
    `;
    const swBlob = new Blob([swCode],{type:"text/javascript"});
    const swURL = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL);
}
</script>
</body>
</html>
