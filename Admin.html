<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>jawrab - Blogger Video Publisher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 900px; margin: auto; background: #1f2833; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #66fcf1; text-align: center; margin-top: 0; font-size: 28px; border-bottom: 2px solid #45f3ff; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; color: #45f3ff; }
        input, textarea, select {
            width: 100%; margin: 5px 0 15px 0; padding: 12px; border-radius: 8px; border: 1px solid #45f3ff; background: #0b0c10; color: #fff; box-sizing: border-box; font-size: 15px;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #66fcf1; box-shadow: 0 0 8px #66fcf1; }
        .row { display: flex; gap: 15px; }
        .row .col { flex: 1; }
        button {
            padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin: 5px 0;
        }
        .btn-main { background: #66fcf1; color: #0b0c10; width: 100%; }
        .btn-main:hover { background: #45f3ff; box-shadow: 0 0 10px #45f3ff; }
        .btn-sec { background: #1f2833; color: #66fcf1; border: 1px solid #66fcf1; }
        .btn-sec:hover { background: #66fcf1; color: #0b0c10; }
        .btn-danger { background: #d9534f; color: #fff; }
        .btn-danger:hover { background: #c9302c; }
        .postItem { background: #0b0c10; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #1f2833; display: flex; justify-content: space-between; align-items: center; }
        #statusText { font-weight: bold; color: #ffca28; text-align: center; display: block; margin: 15px 0; font-size: 16px; }
        .section-type { background: #151b24; padding: 15px; border-radius: 10px; border-left: 4px solid #66fcf1; margin-bottom: 20px; }
        #previewContainer { background: #0b0c10; padding: 20px; border-radius: 10px; border: 1px dashed #66fcf1; margin-top: 20px; display: none; }
        pre { white-space: pre-wrap; word-wrap: break-word; color: #a9eed1; background: #151b24; padding: 10px; border-radius: 5px; font-family: monospace; }
    </style>
</head>

<body>

<div class="container">
    <h2>🎬 منصة نشر الفيديو والأفلام - jawrab</h2>
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="btn-sec" onclick="login()">تسجيل الدخول بكود جديد 🔑</button>
        <span id="statusText">جاري التحقق من الجلسة... ⏳</span>
    </div>

    <hr style="border-color: #333; margin: 20px 0;">

    <label>نوع المحتوى</label>
    <select id="contentType" onchange="toggleSections()">
        <option value="MOVIE">🎥 نشر فيلم احترافي</option>
        <option value="YOUTUBE">📺 فيديو يوتيوب</option>
        <option value="NORMAL_VIDEO">📼 فيديو عادي / متعدد الجودات</option>
    </select>

    <label>عنوان المقال / الفيلم</label>
    <input id="title" placeholder="مثال: فيلم Interstellar 2014 مترجم بجودة عالية">

    <label>التصنيفات</label>
    <input id="labels" placeholder="افصل بين التصنيفات بفاصلة (مثال: أفلام, أكشن, 2026)">

    <div id="movieSection" class="section-type">
        <label>رابط الفيلم المباشر (سيتم إضافة #.mp4 تلقائياً)</label>
        <input id="movieLink" placeholder="https://example.com/movie/video">
        
        <label>رفع ملف الترجمة (صيغة .srt فقط)</label>
        <input type="file" id="subtitleFile" accept=".srt">
    </div>

    <div id="youtubeSection" class="section-type" style="display:none;">
        <label>رابط فيديو اليوتيوب</label>
        <input id="youtubeLink" placeholder="https://www.youtube.com/watch?v=xxxxxx">
    </div>

    <div id="videoSection" class="section-type" style="display:none;">
        <div class="row">
            <div class="col">
                <label>رابط الفيديو المباشر (سيتم إضافة #.mp4 تلقائياً)</label>
                <input id="normalVideoLink" placeholder="https://example.com/video">
            </div>
            <div class="col">
                <label>رابط صورة الفيديو (سيتم إضافة #.png تلقائياً)</label>
                <input id="videoThumb" placeholder="https://example.com/image">
            </div>
        </div>
        
        <label>روابط الجودات المتعددة (اختياري - اتبع النمط المطلوب إذا وُجدت جودات متعددة)</label>
        <textarea id="qualitiesInput" style="min-height: 60px;" placeholder="مثال: #1080|رابط_الجودة_الأولى#720|رابط_الجودة_الثانية"></textarea>
    </div>

    <label>الوصف / محتوى النص الإضافي للمقال</label>
    <textarea id="content" placeholder="اكتب قصة الفيلم أو وصف الفيديو هنا..."></textarea>

    <div class="row">
        <div class="col">
            <label>حالة النشر</label>
            <select id="postStatus">
                <option value="DRAFT">مسودة</option>
                <option value="LIVE">نشر مباشر للجمهور</option>
            </select>
        </div>
    </div>

    <button class="btn-sec" style="width:100%; margin-bottom: 10px;" onclick="previewCode()">👁️ معاينة الكود النهائي قبل النشر</button>
    
    <div id="previewContainer">
        <h3 style="color: #66fcf1; margin-top: 0;">شكل الكود الذي سيُرسل إلى بلوجر:</h3>
        <pre id="previewText"></pre>
    </div>

    <button class="btn-main" onclick="publish()">🚀 نشر / تعديل المقال المقال الحالية</button>
    <button class="btn-sec" onclick="loadPosts()">🔄 عرض وإدارة المقالات الحالية</button>

    <div id="posts"></div>
</div>

<script>
const CLIENT_ID = "1095244236392-eqhgorr4t587vvr4vblmvlkqbh8kae9i.apps.googleusercontent.com";
const BLOG_ID = "6155177137677743195";

let token = "";
let editMode = false;
let editPostId = null;
let subtitleContent = "";

// نظام الجلسة اللانهائية: التحقق من وجود توكن محفوظ مسبقاً فور فتح الصفحة
window.onload = function() {
    let savedToken = localStorage.getItem("jawrab_token");
    if(savedToken) {
        token = savedToken;
        document.getElementById("statusText").innerText = "تم استعادة الجلسة تلقائياً من المتصفح ✅";
    } else {
        document.getElementById("statusText").innerText = "لم يتم تسجيل الدخول، يرجى تسجيل الدخول أولاً ❌";
    }
    
    // رصد قراءة ملف الترجمة تلقائياً عند اختياره
    document.getElementById("subtitleFile").addEventListener("change", function(e) {
        let file = e.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(evt) {
            subtitleContent = evt.target.result;
            alert("تم استخراج نص الترجمة بنجاح وسيتم تضمينه برمجياً!");
        };
        reader.readAsText(file);
    });
};

/* ===== تسجيل الدخول وحفظ التوكن في المتصفح للأبد ===== */
function login(){
    const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/blogger",
        callback: (res) => {
            if (res.access_token) {
                token = res.access_token;
                localStorage.setItem("jawrab_token", token); // حفظ في المتصفح لجلسة لانهائية
                document.getElementById("statusText").innerText = "تم تسجيل الدخول وحفظ الجلسة بنجاح ✅";
            } else {
                document.getElementById("statusText").innerText = "فشل الحصول على رمز الدخول ❌";
            }
        }
    });
    client.requestAccessToken();
}

/* ===== التحكم بظهور الحقول حسب الاختيار ===== */
function toggleSections() {
    let type = document.getElementById("contentType").value;
    document.getElementById("movieSection").style.display = (type === "MOVIE") ? "block" : "none";
    document.getElementById("youtubeSection").style.display = (type === "YOUTUBE") ? "block" : "none";
    document.getElementById("videoSection").style.display = (type === "NORMAL_VIDEO") ? "block" : "none";
}

/* ===== بناء كود المحتوى بناء على الشروط الاحترافية المطلوبة ===== */
function buildFinalContent() {
    let type = document.getElementById("contentType").value;
    let extraContent = document.getElementById("content").value.trim();
    let finalHTML = "";

    if (type === "MOVIE") {
        let movieLink = document.getElementById("movieLink").value.trim();
        // أول كود في المقال يكون الرمز المخفي --movie--
        finalHTML += "--movie--\n";
        
        if(movieLink) {
            finalHTML += `<div class="jawrab-movie-player" data-src="${movieLink}#.mp4"></div>\n`;
        }
        if(subtitleContent) {
            finalHTML += `--subtitle--\n${subtitleContent}\n--subtitle--\n`;
        }
        
    } else if (type === "YOUTUBE") {
        let youtubeLink = document.getElementById("youtubeLink").value.trim();
        if(youtubeLink) {
            finalHTML += `<div class="jawrab-youtube-player" data-url="${youtubeLink}"></div>\n`;
        }
        
    } else if (type === "NORMAL_VIDEO") {
        let normalVideoLink = document.getElementById("normalVideoLink").value.trim();
        let videoThumb = document.getElementById("videoThumb").value.trim();
        let qualities = document.getElementById("qualitiesInput").value.trim();

        let videoAttr = normalVideoLink ? `data-video="${normalVideoLink}#.mp4"` : '';
        let thumbAttr = videoThumb ? `data-poster="${videoThumb}#.png"` : '';
        let qualityAttr = qualities ? `data-qualities="${qualities}"` : '';

        finalHTML += `<div class="jawrab-custom-video" ${videoAttr} ${thumbAttr} ${qualityAttr}></div>\n`;
    }

    // إضافة الوصف النصي للمقالة في النهاية
    if(extraContent) {
        finalHTML += `<div class="jawrab-description">${extraContent}</div>`;
    }

    return finalHTML;
}

/* ===== زر المعاينة قبل النشر ===== */
function previewCode() {
    let code = buildFinalContent();
    document.getElementById("previewText").innerText = code;
    document.getElementById("previewContainer").style.display = "block";
}

/* ===== نشر المقال للـ API ===== */
async function publish(){
    if(!token){
        alert("تنبيه: لم تسجل الدخول أو انتهت جلستك، يرجى الضغط على زر تسجيل الدخول أولاً");
        return;
    }

    let titleValue = document.getElementById("title").value.trim();
    let statusValue = document.getElementById("postStatus").value;
    let labelsInput = document.getElementById("labels").value;
    let labelsArray = labelsInput ? labelsInput.split(",").map(l => l.trim()).filter(l => l !== "") : [];

    if(!titleValue) {
        alert("يرجى كتابة عنوان المقال أولاً");
        return;
    }

    document.getElementById("statusText").innerText = "جاري رفع البيانات إلى بلوجر... ⏳";
    
    let finalBodyContent = buildFinalContent();

    let postData = {
        kind: "blogger#post",
        title: titleValue,
        content: finalBodyContent
    };

    if(labelsArray.length > 0) {
        postData.labels = labelsArray;
    }

    let url = "";
    let method = "";

    if(editMode && editPostId){
        url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${editPostId}`;
        method = "PUT";
    } else {
        url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/insert`;
        method = "POST";
    }

    url += `?isDraft=${statusValue !== "LIVE"}`;

    try {
        let res = await fetch(url,{
            method,
            headers:{
                "Authorization":"Bearer " + token,
                "Content-Type":"application/json"
            },
            body: JSON.stringify(postData)
        });

        if(res.ok){
            document.getElementById("statusText").innerText = editMode ? "تم التعديل الاحترافي بنجاح ✏️" : "تم نشر الفيديو/الفيلم بنجاح 🚀";

            // تفريغ الحقول وإعادة التهيئة
            document.getElementById("title").value = "";
            document.getElementById("content").value = "";
            document.getElementById("labels").value = "";
            document.getElementById("movieLink").value = "";
            document.getElementById("youtubeLink").value = "";
            document.getElementById("normalVideoLink").value = "";
            document.getElementById("videoThumb").value = "";
            document.getElementById("qualitiesInput").value = "";
            document.getElementById("subtitleFile").value = "";
            subtitleContent = "";
            document.getElementById("previewContainer").style.display = "none";

            editMode = false;
            editPostId = null;

            loadPosts(); 
        } else {
            let errorData = await res.json();
            console.error(errorData);
            document.getElementById("statusText").innerText = `خطأ في النشر: ${errorData.error.message} ❌`;
        }
    } catch (err) {
        console.error(err);
        document.getElementById("statusText").innerText = "خطأ في الاتصال بالشبكة ❌";
    }
}

/* ===== عرض المقالات ===== */
async function loadPosts(){
    if(!token){
        alert("سجل الدخول أولاً");
        return;
    }
    document.getElementById("posts").innerHTML = "<p style='text-align:center;'>جاري سحب المقالات الفيديوهات... ⏳</p>";
    try {
        let res = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts`, {
            headers:{"Authorization":"Bearer " + token}
        });
        let data = await res.json();
        let html = "";
        if(data.items && data.items.length > 0) {
            data.items.forEach(p=>{
                html += `
                <div class="postItem">
                    <b>${p.title}</b>
                    <div>
                        <button class="btn-sec" onclick="editPost('${p.id}','${encodeURIComponent(p.title)}','${encodeURIComponent(p.content)}')">تعديل</button>
                        <button class="btn-danger" onclick="deletePost('${p.id}')">حذف</button>
                    </div>
                </div>`;
            });
        } else {
            html = "<p style='text-align:center;'>لا توجد فيديوهات منشورة حالياً.</p>";
        }
        document.getElementById("posts").innerHTML = html;
    } catch(err) {
        document.getElementById("posts").innerHTML = "<p style='text-align:center;'>حدث خطأ أثناء الاتصال ❌</p>";
    }
}

/* ===== وضع التعديل ===== */
function editPost(id, title, content){
    editMode = true;
    editPostId = id;
    document.getElementById("title").value = decodeURIComponent(title);
    document.getElementById("content").value = decodeURIComponent(content);
    document.getElementById("statusText").innerText = "أنت الآن تقوم بتعديل منشور قديم ✏️";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== حذف المقال ===== */
async function deletePost(id){
    if(!confirm("هل تريد حذف هذا الفيديو نهائياً من النظام؟")) return;
    try {
        let res = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/${id}`, {
            method:"DELETE",
            headers:{ "Authorization":"Bearer " + token }
        });
        if(res.ok) { loadPosts(); }
    } catch (err) { console.error(err); }
}
</script>
</body>
</html>
