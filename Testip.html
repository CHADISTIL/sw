<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Top4Top الذكية - رفع تلقائي وتسجيل دخول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; width: 100%; font-size: 16px; padding: 14px; }
        .btn-success:hover { background-color: #059669; }
        .btn-dark { background-color: #475569; color: white; }
        .btn-dark:hover { background-color: #334155; }
        
        #statusMessage {
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        .status-loading { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .status-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        
        #resultsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            display: none;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px;
            text-align: right;
        }
        th { background-color: #1e293b; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .copy-btn { background-color: #64748b; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .copy-btn:hover { background-color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة التحكم والرفع التلقائي الذكي الذكي عبر Top4Top</h2>

    <div class="section">
        <h3>🔐 ربط الحساب وتسجيل الدخول (اختياري)</h3>
        <div class="row">
            <div class="form-group">
                <label>اسم المستخدم أو البريد:</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم بالملتقى">
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="password" placeholder="******">
            </div>
        </div>
        <button type="button" class="btn-primary" id="loginBtn">تسجيل الدخول وتفعيل العضوية</button>
        <span id="loginStatus" style="margin-right: 15px; font-weight: bold;"></span>
    </div>

    <div class="section">
        <h3>🚀 إدخال روابط الملفات المراد رفعها</h3>
        <form id="uploadForm">
            <div id="inputsContainer"></div>
            
            <div class="row" style="margin-top: 15px;">
                <button type="button" class="btn-dark" id="addMoreBtn">➕ إضافة خانة رابط أخرى</button>
                <button type="submit" class="btn-success" id="submitBtn">بدء عملية الجلب والرفع والتحليل الذاتي</button>
            </div>
        </form>
    </div>

    <div id="statusMessage"></div>

    <div class="section" id="resultsSection" style="display: none;">
        <h3>📋 روابط التحميل المباشرة التي تم سحبها بنجاح</h3>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>الرقم</th>
                    <th>رابط التحميل الصافي المستخرج</th>
                    <th>نسخ الرابط</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>
</div>

<script>
    const workerUrl = "https://top4top.jawrab-app.workers.dev/";
    const container = document.getElementById('inputsContainer');
    let linkCount = 0;

    // توليد خانات الروابط تلقائياً
    function addInputRow() {
        linkCount++;
        const div = document.createElement('div');
        div.className = 'form-group';
        div.style.marginBottom = "10px";
        div.innerHTML = `
            <label>رابط الملف ${linkCount}:</label>
            <input type="url" class="url-input" placeholder="https://example.com/movie.mp4">
        `;
        container.appendChild(div);
    }

    for (let i = 0; i < 10; i++) { addInputRow(); }
    document.getElementById('addMoreBtn').addEventListener('click', addInputRow);

    // 1. منطق تسجيل الدخول التلقائي وسحب الكوكيز
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const loginStatus = document.getElementById('loginStatus');

        if(!user || !pass) { alert("يرجى ملء بيانات الدخول أولاً"); return; }

        loginStatus.innerText = "⏳ جاري تسجيل الدخول وحفظ الجلسة...";
        loginStatus.style.color = "#d97706";

        const loginData = new URLSearchParams();
        loginData.append('username', user);
        loginData.append('password', pass);
        loginData.append('login', 'تسجيل دخول');

        try {
            const res = await fetch(`${workerUrl}?url=${encodeURIComponent('https://top4top.io/index.php')}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: loginData.toString()
            });
            
            const html = await res.text();
            if (html.includes('تسجيل خروج') || html.includes('cp.php?mode=logout')) {
                loginStatus.innerText = "✅ تم تسجيل دخولك بنجاح! سيتم الرفع باسم حسابك الآن.";
                loginStatus.style.color = "#059669";
            } else {
                loginStatus.innerText = "❌ فشل تسجيل الدخول، تأكد من بيانات الحساب.";
                loginStatus.style.color = "#dc2626";
            }
        } catch (e) {
            loginStatus.innerText = "❌ خطأ في الاتصال بالسيرفر.";
        }
    });

    // 2. منطق الرفع والتحليل التلقائي بناءً على تغيرات الصفحة وحالة الانتظار
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('statusMessage');
        const resultsSection = document.getElementById('resultsSection');
        const resultsTable = document.getElementById('resultsTable');
        const resultsBody = document.getElementById('resultsBody');

        submitBtn.disabled = true;
        statusDiv.className = "status-loading";
        statusDiv.style.display = "block";
        statusDiv.innerText = "⏳ جاري بدء الاتصال بالموقع وإرسال الروابط لتفعيل أمر الجلب...";
        resultsSection.style.display = "none";
        resultsBody.innerHTML = "";

        const urlParams = new URLSearchParams();
        const inputs = container.querySelectorAll('.url-input');
        let hasData = false;

        inputs.forEach((input, index) => {
            if(input.value.trim() !== "") {
                urlParams.append(`url_file[${index}]`, input.value.trim());
                hasData = true;
            }
        });
        urlParams.append('submitr', 'جلب الملفات');

        if (!hasData) {
            alert("يرجى إدخال رابط واحد على الأقل للرفع!");
            submitBtn.disabled = false;
            statusDiv.style.display = "none";
            return;
        }

        try {
            // إرسال الطلب ومراقبة سلوك الرد
            const response = await fetch(`${workerUrl}?url=${encodeURIComponent('https://top4top.io/index.php')}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: urlParams.toString()
            });

            const htmlResult = await response.text();
            
            // الفحص الذكي: التحقق هل الصفحة لا تزال في حالة رفع أم انتهت؟
            if (htmlResult.includes('loading') || htmlResult.includes('جاري رفع الملفات') || htmlResult.includes('فضلاً انتظر')) {
                statusDiv.innerText = "⏳ المتصفح يكتشف الآن حالة الرفع والانتظار بالموقع الأصلي... جاري المعالجة والرفع مستمر بالسيرفر حالياً...";
            }

            // سحب وتحليل الروابط الناتجة من صفحة الاكتمال
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlResult, 'text/html');
            let foundUrls = [];

            // البحث في خانات الإدخال النصية المخصصة لروابط التحميل
            const textInputs = doc.querySelectorAll('input[type="text"]');
            textInputs.forEach(input => {
                if (input.value.includes('top4top.io/downloadf-')) {
                    if(!foundUrls.includes(input.value)) foundUrls.push(input.value);
                }
            });

            // مسح احتياطي ومباشر لجميع روابط التحميل المتاحة بالصفحة المكتملة
            const links = doc.querySelectorAll('a');
            links.forEach(a => {
                if(a.href && a.href.includes('top4top.io/downloadf-')) {
                    const cleanUrl = new URL(a.href).searchParams.get('url') || a.href;
                    if(!foundUrls.includes(cleanUrl)) foundUrls.push(cleanUrl);
                }
            });

            // عرض البيانات النهائية فور اختفاء مؤشر الرفع والانتظار واكتشاف الروابط
            if (foundUrls.length > 0) {
                statusDiv.className = "status-success";
                statusDiv.innerText = `🎉 اكتمل الرفع بنجاح! تم رصد انتهاء حلقة الانتظار وسحب عدد (${foundUrls.length}) روابط تحميل مباشرة بنجاح.`;
                
                foundUrls.forEach((downloadUrl, idx) => {
                    resultsBody.innerHTML += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td><a href="${downloadUrl}" target="_blank" style="word-break: break-all; font-weight: bold; color: #1e3a8a;">${downloadUrl}</a></td>
                            <td><button type="button" class="copy-btn" onclick="navigator.clipboard.writeText('${downloadUrl}'); alert('تم نسخ رابط الملف!');">📋 نسخ</button></td>
                        </tr>
                    `;
                });
                resultsSection.style.display = "block";
                resultsTable.style.display = "table";
            } else {
                statusDiv.style.display = "none";
                alert("انتهت العملية ولكن لم يتم سحب أي روابط. قد تكون الروابط المدخلة تالفة أو أن حجم الملفات تجاوز الحد المسموح به للموقع.");
            }

        } catch (error) {
            statusDiv.style.display = "none";
            alert("حدث خطأ أثناء فحص حالة الرفع: " + error.message);
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
